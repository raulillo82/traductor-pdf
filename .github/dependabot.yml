version: 2
updates:
  # "/" ya recorre también webapp/requirements*.txt: una entrada /webapp solo duplicaría las PR
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Imágenes base de webapp/ y worker/ (podman las construye con -f webapp/Dockerfile, etc.)
  - package-ecosystem: docker
    directory: /webapp
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    ignore:
      # onnxruntime (dependencia de argostranslate) no tiene ruedas para Python 3.15: el pip install
      # del worker no resuelve. Revisar cuando las tenga y subir a mano.
      - dependency-name: "library/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
